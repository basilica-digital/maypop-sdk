name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Verify tag matches package version
        run: |
          node --input-type=module -e '
            import pkg from "./package.json" with { type: "json" };
            const expected = `v${pkg.version}`;
            if (process.env.GITHUB_REF_NAME !== expected) {
              throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match ${expected}`);
            }
          '
      - name: Check npm registry
        id: registry
        run: |
          package_name=$(node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; process.stdout.write(pkg.name)')
          package_version=$(node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; process.stdout.write(pkg.version)')
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi
      - if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --provenance
